name: tests
on:
  push:
    paths: ['Casks/**', '.github/workflows/**']
  pull_request:
    paths: ['Casks/**', '.github/workflows/**']
jobs:
  test:
    runs-on: macos-latest
    env:
      # The online audit hits the GitHub API — without a token it's 60/hr,
      # shared across the runner, and rate-limits immediately.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: brew update
      # brew audit/style want a tap name, not a path — so tap this checkout.
      - run: brew tap amzngm/ngclock "$GITHUB_WORKSPACE"
      - run: brew style amzngm/ngclock
      - run: brew audit --cask --online amzngm/ngclock/ngclock
